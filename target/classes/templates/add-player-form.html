<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add New Player</h3>
        </div>
	
        <div class="card-body">
            <form th:action="@{/addSinglePlayerFE}" th:object="${player}" method="post">
                <div class="mb-3">
                    <label for="playerName" class="form-label">Player Name</label>
                    <input type="text" th:field="*{playerName}" id="playerName" class="form-control" placeholder="Enter Player Name">
                </div>

                <div class="mb-3">
                    <label for="matchesPlayed" class="form-label">Matches Played</label>
                    <input type="number" th:field="*{matchesPlayed}" id="matchesPlayed" class="form-control" placeholder="Enter Matches Played">
                </div>

                <div class="mb-3">
                    <label for="runsScored" class="form-label">Runs Scored</label>
                    <input type="number" th:field="*{runsScored}" id="runsScored" class="form-control" placeholder="Enter Runs Scored">
                </div>
                
                <div class="mb-3">
                    <label for="country" class="form-label">Country</label>
                    <input type="text" th:field="*{country}" id="country" class="form-control" placeholder="Enter Country">
                </div>
                
                <div class="mb-3">
                    <label for="playerImage" class="form-label">Player Image</label>
                    <input type="text" th:field="*{image}" id="playerImage" class="form-control" placeholder="Enter Player Image">
                </div>

                <button type="submit" class="btn btn-success">Add Player</button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
