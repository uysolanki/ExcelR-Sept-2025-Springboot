<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Player List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
	
    <a th:href="@{'/addPlayerForm'}" class="btn btn-primary btn-sm" > Add New Player </a> 
    
    <h2 class="mb-4">List of Products</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Player Name</th>
            <th>Matches Played</th>
            <th>Runs Scored</th>
            <th>Country</th>
            <th>Photo</th>
            <th>Delete</th>
            <th>Update</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="player : ${players}">
            <td th:text="${player.playerName}"></td>
            <td th:text="${player.matchesPlayed}"></td>
            <td th:text="${player.runsScored}"></td>
            <td th:text="${player.country}"></td>
            
            <td>
                <img th:src="${player.image}"
                     width="80"
                     height="80"
                     style="object-fit:cover;">
            </td>
            
           <td><a th:href="@{'/deletePlayerFE/' + ${player.jerseyNumber}}" class="btn btn-danger btn-sm" 
               onclick="return confirm('Are you sure you want to delete this Player?');"> Delete </a> </td>
               
  <td><a th:href="@{'/updatePlayerFormFE/' + ${player.jerseyNumber}}" class="btn btn-secondary btn-sm"> Update </a> </td>
            
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
